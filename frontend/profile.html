<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Ravi Gallery — Photographer profile." />
  <meta name="theme-color" content="#070810" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/main.css" />
  <title>Profile — Ravi Gallery</title>
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav__logo">Ravi Gallery</a>
    <div class="nav__actions">
      <button class="btn-theme" id="themeToggle" aria-label="Toggle theme">🌙</button>
      <button class="nav__hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
  <div class="nav-overlay" id="navOverlay"></div>
  <nav class="nav-drawer" id="navDrawer">
    <a href="/" class="nav-drawer__link"><span class="icon">🏠</span> Home</a>
    <a href="/gallery.html" class="nav-drawer__link"><span class="icon">🖼️</span> Gallery</a>
    <a href="/upload.html" class="nav-drawer__link"><span class="icon">📤</span> Upload</a>
    <a href="/profile.html" class="nav-drawer__link active" aria-current="page"><span class="icon">👤</span> Profile</a>
  </nav>

  <main class="page">
    <div class="container" style="max-width:720px">

      <!-- Profile Header (skeleton while loading) -->
      <div id="profileSkeleton" class="profile-header">
        <div class="skeleton" style="width:100px;height:100px;border-radius:50%;margin:0 auto var(--gap-md)"></div>
        <div class="skeleton" style="width:180px;height:2rem;margin:0 auto var(--gap-sm);border-radius:var(--r-md)"></div>
        <div class="skeleton" style="width:260px;height:1rem;margin:0 auto;border-radius:var(--r-md)"></div>
      </div>

      <!-- Actual Profile Header -->
      <div id="profileHeader" class="profile-header hidden">
        <div class="avatar-wrap">
          <div id="avatarContainer">
            <!-- JS fills: img or placeholder div -->
          </div>
          <button class="avatar-edit-btn" id="avatarEditBtn" aria-label="Change avatar" title="Change avatar">✎</button>
          <input type="file" id="avatarInput" accept="image/*" class="sr-only" aria-label="Select avatar image" />
        </div>
        <h1 class="profile-name" id="profileName">…</h1>
        <p class="profile-bio" id="profileBio">…</p>

        <!-- Location & Website -->
        <div class="flex gap-md mt-sm" style="justify-content:center;flex-wrap:wrap">
          <span class="text-sm text-muted" id="profileLocation" style="display:none">📍 <span></span></span>
          <a class="text-sm text-accent" id="profileWebsite" href="#" target="_blank" rel="noopener" style="display:none">🔗 <span></span></a>
        </div>

        <!-- Social Links -->
        <div class="flex gap-sm mt-sm" id="socialLinks" style="justify-content:center">
          <!-- filled by JS -->
        </div>

        <!-- Stats -->
        <div class="stats-row">
          <div class="stat">
            <span class="stat__value" id="statPhotos">0</span>
            <span class="stat__label">Photos</span>
          </div>
          <div class="stat">
            <span class="stat__value" id="statLikes">0</span>
            <span class="stat__label">Likes</span>
          </div>
          <div class="stat">
            <span class="stat__value" id="statComments">0</span>
            <span class="stat__label">Comments</span>
          </div>
        </div>

        <button class="btn btn-ghost mt-lg" id="editProfileBtn" aria-label="Edit profile">
          ✎ Edit Profile
        </button>
      </div>

      <!-- Edit Profile Form (hidden by default) -->
      <div id="editProfileForm" class="glass-card hidden" style="padding:var(--gap-lg);margin-bottom:var(--gap-xl)">
        <h2 style="font-family:var(--font-display);font-size:1.5rem;font-weight:300;margin-bottom:var(--gap-lg)">
          Edit <em style="font-style:italic;color:var(--accent-light)">Profile</em>
        </h2>
        <form id="profileForm" novalidate style="display:flex;flex-direction:column;gap:var(--gap-md)">

          <div class="form-group">
            <label class="form-label" for="editName">Name</label>
            <input class="form-input" type="text" id="editName" name="name" maxlength="60" placeholder="Your name" />
          </div>

          <div class="form-group">
            <label class="form-label" for="editBio">Bio</label>
            <textarea class="form-textarea" id="editBio" name="bio" maxlength="300" rows="3" placeholder="Tell the world about yourself…"></textarea>
            <div class="flex justify-between">
              <span class="form-helper">Optional</span>
              <span class="form-helper" id="bioCount">0/300</span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="editLocation">Location</label>
            <input class="form-input" type="text" id="editLocation" name="location" maxlength="100" placeholder="City, Country" />
          </div>

          <div class="form-group">
            <label class="form-label" for="editWebsite">Website</label>
            <input class="form-input" type="url" id="editWebsite" name="website" maxlength="200" placeholder="https://yourwebsite.com" />
          </div>

          <div style="border-top:1px solid var(--border-glass);padding-top:var(--gap-md)">
            <p class="form-label mb-md">Social Links</p>
            <div style="display:flex;flex-direction:column;gap:var(--gap-sm)">
              <div style="display:flex;align-items:center;gap:var(--gap-sm)">
                <span style="font-size:1.2rem;width:28px;text-align:center">📷</span>
                <input class="form-input" type="text" id="editInstagram" name="instagram" maxlength="100" placeholder="Instagram handle" />
              </div>
              <div style="display:flex;align-items:center;gap:var(--gap-sm)">
                <span style="font-size:1.2rem;width:28px;text-align:center">🐦</span>
                <input class="form-input" type="text" id="editTwitter" name="twitter" maxlength="100" placeholder="Twitter/X handle" />
              </div>
              <div style="display:flex;align-items:center;gap:var(--gap-sm)">
                <span style="font-size:1.2rem;width:28px;text-align:center">💼</span>
                <input class="form-input" type="text" id="editLinkedin" name="linkedin" maxlength="100" placeholder="LinkedIn profile URL" />
              </div>
            </div>
          </div>

          <div class="flex gap-sm mt-md" style="flex-wrap:wrap">
            <button type="submit" class="btn btn-primary" id="saveProfileBtn" style="flex:1;justify-content:center">
              <span id="saveIcon">💾</span>
              <span id="saveText">Save Profile</span>
            </button>
            <button type="button" class="btn btn-ghost" id="cancelEditBtn">Cancel</button>
          </div>

        </form>
      </div>

      <!-- Recent Photos -->
      <section class="py-lg">
        <div class="section-header">
          <h2 class="section-title">My <em style="color:var(--accent-light);font-style:italic">Photos</em></h2>
          <a href="/gallery.html" class="btn btn-ghost text-sm">View All →</a>
        </div>

        <div class="masonry-grid" id="skeletonGrid" aria-hidden="true">
          <div class="skeleton-item"><div class="skeleton" style="height:220px"></div></div>
          <div class="skeleton-item"><div class="skeleton" style="height:180px"></div></div>
          <div class="skeleton-item"><div class="skeleton" style="height:260px"></div></div>
          <div class="skeleton-item"><div class="skeleton" style="height:200px"></div></div>
        </div>

        <div class="masonry-grid hidden" id="profileGallery" role="list"></div>

        <div class="empty-state hidden" id="emptyState">
          <span class="empty-state__icon">📷</span>
          <h3 class="empty-state__title">No photos yet</h3>
          <p class="empty-state__text">Start building your gallery.</p>
          <a href="/upload.html" class="btn btn-primary">Upload First Photo</a>
        </div>
      </section>

    </div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <div class="lightbox__topbar">
      <span class="lightbox__title" id="lbTitle"></span>
      <div class="lightbox__controls">
        <button class="lb-btn" id="lbLike" title="Like">♡</button>
        <button class="lb-btn" id="lbComment" title="Comments">💬</button>
        <button class="lb-btn" id="lbDownload" title="Download">⬇</button>
        <button class="lb-btn" id="lbShare" title="Share">↗</button>
        <button class="lb-btn" id="lbClose" title="Close">✕</button>
      </div>
    </div>
    <div class="lightbox__stage" id="lbStage">
      <button class="lightbox__nav prev" id="lbPrev">‹</button>
      <img class="lightbox__img" id="lbImg" src="" alt="" draggable="false" />
      <button class="lightbox__nav next" id="lbNext">›</button>
    </div>
  </div>

  <!-- Comments Modal -->
  <div class="modal-overlay" id="commentModal" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal__handle"></div>
      <div class="modal__header">
        <h3 class="modal__title">Comments</h3>
        <button class="lb-btn" id="closeCommentModal">✕</button>
      </div>
      <div class="modal__body" id="commentModalList"></div>
      <div class="modal__footer">
        <input class="form-input" id="commentAuthorInput" placeholder="Name (optional)" style="max-width:130px" />
        <input class="form-input" id="commentTextInput" placeholder="Add a comment…" style="flex:1" />
        <button class="btn btn-primary btn-icon" id="submitComment">↑</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/lightbox.js"></script>
  <script src="/js/gallery.js"></script>
  <script src="/js/profile.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
