<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Ravi Gallery — Browse the full photo collection." />
  <meta name="theme-color" content="#070810" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/main.css" />
  <title>Gallery — Ravi Gallery</title>
</head>
<body>
  <!-- ── Navigation ──────────────────────────────────────── -->
  <nav class="nav" role="navigation">
    <a href="/" class="nav__logo">Ravi Gallery</a>
    <div class="nav__actions">
      <button class="btn-theme" id="themeToggle" aria-label="Toggle theme">🌙</button>
      <button class="nav__hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
  <div class="nav-overlay" id="navOverlay"></div>
  <nav class="nav-drawer" id="navDrawer">
    <a href="/" class="nav-drawer__link"><span class="icon">🏠</span> Home</a>
    <a href="/gallery.html" class="nav-drawer__link active" aria-current="page"><span class="icon">🖼️</span> Gallery</a>
    <a href="/upload.html" class="nav-drawer__link"><span class="icon">📤</span> Upload</a>
    <a href="/profile.html" class="nav-drawer__link"><span class="icon">👤</span> Profile</a>
  </nav>

  <main class="page">
    <div class="container">

      <!-- Header -->
      <section class="py-lg">
        <p class="hero__eyebrow">✦ Full Collection</p>
        <h1 class="section-title" style="font-family:var(--font-display);font-size:clamp(2rem,6vw,4rem);font-weight:300;letter-spacing:-0.03em;margin-bottom:var(--gap-md)">
          The <em style="font-style:italic;color:var(--accent-light)">Gallery</em>
        </h1>

        <!-- Search -->
        <div class="search-bar mb-md">
          <span class="icon">🔍</span>
          <input type="search" id="searchInput" placeholder="Search by title, tag…" aria-label="Search" autocomplete="off" />
          <button class="btn-icon" id="clearSearch" aria-label="Clear search" style="display:none">✕</button>
        </div>

        <!-- Filters -->
        <div class="filter-bar" role="group" aria-label="Filters">
          <button class="pill active" data-sort="newest">✨ Newest</button>
          <button class="pill" data-sort="popular">🔥 Popular</button>
          <button class="pill" data-sort="oldest">🕰️ Oldest</button>
          <div style="height:24px;width:1px;background:var(--border-glass);margin:0 4px;flex-shrink:0"></div>
          <button class="pill" data-tag="nature">🌿 Nature</button>
          <button class="pill" data-tag="portrait">👤 Portrait</button>
          <button class="pill" data-tag="street">🏙️ Street</button>
          <button class="pill" data-tag="travel">✈️ Travel</button>
          <button class="pill" data-tag="abstract">🎨 Abstract</button>
          <button class="pill" data-tag="architecture">🏛️ Architecture</button>
          <button class="pill" data-tag="food">🍜 Food</button>
          <button class="pill" data-tag="wildlife">🦁 Wildlife</button>
        </div>
      </section>

      <!-- Stats row -->
      <div class="flex items-center justify-between mb-md">
        <p class="section-subtitle" id="imageCount">Loading…</p>
        <div class="flex gap-sm">
          <button class="btn btn-ghost text-sm" id="viewToggle" title="Toggle view" aria-label="Toggle grid view">⊞</button>
        </div>
      </div>

      <!-- Skeleton -->
      <div class="masonry-grid" id="skeletonGrid" aria-hidden="true">
        <div class="skeleton-item"><div class="skeleton" style="height:260px"></div></div>
        <div class="skeleton-item"><div class="skeleton" style="height:190px"></div></div>
        <div class="skeleton-item"><div class="skeleton" style="height:310px"></div></div>
        <div class="skeleton-item"><div class="skeleton" style="height:220px"></div></div>
        <div class="skeleton-item"><div class="skeleton" style="height:270px"></div></div>
        <div class="skeleton-item"><div class="skeleton" style="height:180px"></div></div>
        <div class="skeleton-item"><div class="skeleton" style="height:240px"></div></div>
        <div class="skeleton-item"><div class="skeleton" style="height:200px"></div></div>
      </div>

      <!-- Gallery -->
      <div class="masonry-grid hidden" id="galleryGrid" role="list"></div>

      <!-- Empty -->
      <div class="empty-state hidden" id="emptyState">
        <span class="empty-state__icon">🖼️</span>
        <h3 class="empty-state__title">Nothing here yet</h3>
        <p class="empty-state__text">Try different filters or upload some photos.</p>
        <div class="flex gap-sm" style="justify-content:center;flex-wrap:wrap">
          <button class="btn btn-ghost" id="clearFilters">Clear Filters</button>
          <a href="/upload.html" class="btn btn-primary">Upload Photo</a>
        </div>
      </div>

      <!-- Infinite scroll sentinel -->
      <div class="load-sentinel" id="loadSentinel">
        <div class="spinner hidden" id="loadSpinner"></div>
      </div>

    </div>
  </main>

  <!-- ── Lightbox ──────────────────────────────────────── -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <div class="lightbox__topbar">
      <span class="lightbox__title" id="lbTitle"></span>
      <div class="lightbox__controls">
        <button class="lb-btn" id="lbLike" title="Like">♡</button>
        <button class="lb-btn" id="lbComment" title="Comments">💬</button>
        <button class="lb-btn" id="lbDownload" title="Download">⬇</button>
        <button class="lb-btn" id="lbShare" title="Share">↗</button>
        <button class="lb-btn" id="lbDelete" title="Delete" style="color:var(--rose)">🗑</button>
        <button class="lb-btn" id="lbClose" title="Close">✕</button>
      </div>
    </div>
    <div class="lightbox__stage" id="lbStage">
      <button class="lightbox__nav prev" id="lbPrev">‹</button>
      <img class="lightbox__img" id="lbImg" src="" alt="" draggable="false" />
      <button class="lightbox__nav next" id="lbNext">›</button>
    </div>
  </div>

  <!-- Comments Modal -->
  <div class="modal-overlay" id="commentModal" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal__handle"></div>
      <div class="modal__header">
        <h3 class="modal__title">Comments</h3>
        <button class="lb-btn" id="closeCommentModal">✕</button>
      </div>
      <div class="modal__body" id="commentModalList"></div>
      <div class="modal__footer">
        <input class="form-input" id="commentAuthorInput" placeholder="Name (optional)" style="max-width:130px" />
        <input class="form-input" id="commentTextInput" placeholder="Add a comment…" style="flex:1" />
        <button class="btn btn-primary btn-icon" id="submitComment">↑</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirm Modal -->
  <div class="modal-overlay" id="deleteModal" role="dialog" aria-modal="true">
    <div class="modal" style="max-height:auto">
      <div class="modal__handle"></div>
      <div class="modal__header">
        <h3 class="modal__title" style="color:var(--rose)">Delete Photo?</h3>
        <button class="lb-btn" id="closeDeleteModal">✕</button>
      </div>
      <div class="modal__body">
        <p style="color:var(--text-secondary);padding:var(--gap-md) 0">
          This will permanently delete the photo from the gallery and Cloudinary. This cannot be undone.
        </p>
      </div>
      <div class="modal__footer">
        <button class="btn btn-ghost" id="cancelDelete" style="flex:1">Cancel</button>
        <button class="btn btn-danger" id="confirmDelete" style="flex:1">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/lightbox.js"></script>
  <script src="/js/gallery.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
